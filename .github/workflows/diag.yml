name: Diagnose Datenquellen
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag }
      - name: Quellen abrufen
        run: |
          mkdir -p diag; cd diag; rm -f *
          N=https://services.swpc.noaa.gov
          W=https://astro-go.astrobert.workers.dev
          O=https://robert-tech-byte.github.io
          g() { code=$(curl -sS -L --max-time 60 -H "Origin: $O" -D "$1.hdr" -o "$1" -w '%{http_code} %{size_download} %{content_type}' "$2" 2>&1); echo "$1 | $code | $2" >> index.txt; }
          g kpForecast.json $N/products/noaa-planetary-k-index-forecast.json
          g kpNow.json $N/json/planetary_k_index_1m.json
          g outlook27.txt $N/text/27-day-outlook.txt
          g ovation.json $N/json/ovation_aurora_latest.json
          g mag.json $N/json/rtsw/rtsw_mag_1m.json
          g wind.json $N/json/rtsw/rtsw_wind_1m.json
          g w_hpo_kp.json $W/hpo-kp
          g w_hpo_hp30.json $W/hpo-hp30
          g w_hpo_hp60.json $W/hpo-hp60
          g w_kp.json $W/kp
          g w_hp30.json $W/hp30
          g w_swift.csv $W/swift
          g site_meta.json $O/astro-go/data/meta.json
          g site_index.html $O/astro-go/index.html
          g site_aurora.js $O/astro-go/aurora-core.js
          head -c 20000 ovation.json > ovation_head.json; rm ovation.json
          cat index.txt
      - name: Ablegen
        run: |
          git config user.name "diag-bot"; git config user.email "diag-bot@users.noreply.github.com"
          git add diag; git commit -qm "Diagnose $(date -u +%FT%TZ)" || true; git push -q origin HEAD:diag
